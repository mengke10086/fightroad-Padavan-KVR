name: Build Padavan YK-L1 (fightroad)

on:
  workflow_dispatch:        # 手动触发 Run workflow
  push:
    branches: [ master, main ]

env:
  SRC_DIR: /opt/fightroad-Padavan-KVR
  WORK_DIR: /opt/fightroad-Padavan-KVR/trunk
  BOARD: YK-L1
  CONFIG_SRC: configs/boards/YK-L1/kernel-3.4.x.config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk flex bison wget unzip \
          git curl xxd fakeroot cpio

    - name: Download toolchain (mipsel)
      working-directory: ${{ env.SRC_DIR }}/toolchain-mipsel
      run: |
        chmod +x dl_toolchain.sh
        ./dl_toolchain.sh

    - name: Copy YK-L1 config & prepare
      working-directory: ${{ env.WORK_DIR }}
      run: |
        cp ${{ env.CONFIG_SRC }} .config
        make oldconfig

    - name: Compile firmware (YK-L1)
      working-directory: ${{ env.WORK_DIR }}
      run: make -j$(nproc)

    - name: Upload firmware artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Padavan-YK-L1-Firmware
        path: ${{ env.WORK_DIR }}/images/*.trx
        if-no-files-found: error
